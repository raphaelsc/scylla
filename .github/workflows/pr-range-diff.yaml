name: Post range-diff on PR force-push

on:
  pull_request_target:
    types: [synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  range-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # No checkout of the PR's code: only git objects are fetched and compared,
      # nothing from the PR is executed, so pull_request_target is safe here.
      - name: Fetch old and new heads
        env:
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          OLD_HEAD: ${{ github.event.before }}
          NEW_HEAD: ${{ github.event.after }}
        run: |
          git init -q repo && cd repo
          git remote add origin "$REPO_URL"
          # Blobless fetch keeps it cheap; range-diff fetches the blobs it needs lazily.
          git fetch -q --filter=blob:none origin "$BASE_SHA" "$OLD_HEAD" "$NEW_HEAD"

      - name: Detect force-push
        id: forced
        working-directory: repo
        env:
          OLD_HEAD: ${{ github.event.before }}
          NEW_HEAD: ${{ github.event.after }}
        run: |
          # A push that only appends commits keeps the old head as an ancestor.
          if git merge-base --is-ancestor "$OLD_HEAD" "$NEW_HEAD"; then
            echo "forced=false" >> "$GITHUB_OUTPUT"
          else
            echo "forced=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute range-diff
        if: steps.forced.outputs.forced == 'true'
        working-directory: repo
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          OLD_HEAD: ${{ github.event.before }}
          NEW_HEAD: ${{ github.event.after }}
        run: |
          old_base=$(git merge-base "$BASE_SHA" "$OLD_HEAD")
          new_base=$(git merge-base "$BASE_SHA" "$NEW_HEAD")
          # A higher creation factor pairs a reworked commit with its previous
          # version (showing the edit) instead of reporting it as dropped and
          # re-added, which the default does when most of a small patch changes.
          git range-diff --no-color --creation-factor=100 "$old_base..$OLD_HEAD" "$new_base..$NEW_HEAD" > ../range-diff.txt
          {
            echo "### Changes since previous version"
            echo
            echo "\`${OLD_HEAD:0:12}\` → \`${NEW_HEAD:0:12}\`"
            echo
            echo "<details><summary>git range-diff</summary>"
            echo
            echo '```diff'
            # GitHub comments are capped at 65536 characters.
            head -c 60000 ../range-diff.txt
            echo '```'
            echo "</details>"
            echo
            echo "Reproduce locally: \`git fetch origin $OLD_HEAD $NEW_HEAD && git range-diff --creation-factor=100 $old_base..$OLD_HEAD $new_base..$NEW_HEAD\`"
          } > ../comment.md

      - name: Post comment
        if: steps.forced.outputs.forced == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: gh pr comment "$PR" --body-file comment.md
